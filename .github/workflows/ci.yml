name: CI

on:
  push:
    branches: [main, qwen3.8-27b-code-review]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Matches the fvm-pinned version the app is verified against locally.
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify localizations are generated and up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/app_localizations.dart lib/l10n/app_localizations_en.dart

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        # One accepted info remains (package_names: the package is 'Lore';
        # renaming it is a separate mechanical sweep). Errors and warnings
        # remain fatal.
        run: flutter analyze --no-fatal-infos --fatal-warnings

      - name: Test
        run: flutter test

  build-linux:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Install desktop toolchain
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux desktop
        run: flutter build linux --release
